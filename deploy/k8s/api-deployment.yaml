apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceai-api
  namespace: traceai-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: traceai-api
  template:
    metadata:
      labels:
        app: traceai-api
    spec:
      containers:
        - name: api
          image: ghcr.io/traceai/api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/info
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traceai-api-hpa
  namespace: traceai-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traceai-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
