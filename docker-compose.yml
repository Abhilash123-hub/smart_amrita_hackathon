version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: traceai-api
    ports:
      - "8000:8000"
    environment:
      - TRACEAI_POSTGRES_URL=postgresql://traceai:traceai_secret@postgres:5432/traceai
      - TRACEAI_REDIS_URL=redis://redis:6379/0
      - TRACEAI_STORAGE_ROOT=/app/data
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    container_name: traceai-worker
    environment:
      - TRACEAI_POSTGRES_URL=postgresql://traceai:traceai_secret@postgres:5432/traceai
      - TRACEAI_REDIS_URL=redis://redis:6379/0
      - TRACEAI_STORAGE_ROOT=/app/data
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: traceai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: traceai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: traceai
      POSTGRES_USER: traceai
      POSTGRES_PASSWORD: traceai_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceai -d traceai"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: traceai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
